<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alvin's Calendar</title>
    <meta name="description" content="This is Alvin's calendar.">
    <style>
        body {
            background-color: #292929;
            margin: 0;
            display: flex;
            justify-content: center; /* 讓主容器置中 */
            min-height: 100vh;
            overflow-y: auto;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 讓內部所有內容靠左對齊 */
            width: 90%; /* 設置與 iframe 相同的寬度 */
            max-width: 1024px; /* 設置與 iframe 相同的最大寬度 */
            padding-top: 20px;
            padding-bottom: 40px;
            box-sizing: border-box;
        }

        .info-container {
            margin-bottom: 20px;
            text-align: left;
            font-family: monospace;
            color: white;
            transform: translateX(10px); /* 新增：只移動這個區塊 */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3); /* 新增：為文字加上陰影 */

        }

        .color-legend {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border-radius: 4px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        .legend-box.red { background-color: #EC4E20; }
        .legend-box.yellow { background-color: #FFE93F; }
        .legend-box.green { background-color: #7fb344; }

        iframe {
            width: 100%; /* 讓 iframe 填滿父容器寬度 */
            height: 90%;
            border-radius: 20px;
            box-shadow: 0 5px 10px rgb(0 0 0 / 0.3);
            background-color: rgba(255, 255, 255, 0.03);
            flex-grow: 1;
        }

        @media only screen and (max-width: 480px) {
            .main-container {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="info-container">
            <h2>Alvin's Calendar</h2>
            <div class="color-legend">
                <div class="legend-item">
                    <div class="legend-box red"></div>
                    <span>課表</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box yellow"></div>
                    <span>工作</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box green"></div>
                    <span>私人行程</span>
                </div>
            </div>
        </div>
        <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FTaipei&showPrint=0&mode=WEEK&title=Alvin's%20Calendar&src=Y2hpYW55YW8yMTJAZ21haWwuY29t&src=MGNlOWY2NDk3ZThiYzhmOTJjODdhZWQwY2E2Njg5Njc2NTZkZjgzMDAyYzNkZTZlZmZmM2YzZjE1NjRiMWNkYkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=OGRkMmEzN2E2MTczNDU3MjA5NTcwZTNjNTU2ZDEyYmNmZGMxZjkwMDQwYTI2ZWI1ODYxMDFhNDMyZDEzZGEyZEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=YjBlY2ZhY2U2MzUzMDU3YzhlN2EyZTZhOTIwNzIzZTNhYmNjZTljMWRhYmE4OGY0ZTE3MjkyZTFkY2E2ODYzYUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%237cb342&color=%23f6bf26&color=%23d50000&color=%237cb342"
            style="border-width:0" width="800" height="600"
            frameborder="0" scrolling="no"></iframe>
    </div>
</body>
</html>
